[project]
name = "stockroom"
version = "0.1.0"
description = "KiCad V10 component-library manager"
requires-python = ">=3.12"
dependencies = [
    "easyeda2kicad>=1.0.1",
    "curl_cffi>=0.7",
    # The portable headless-Chromium render tier (stockroom.scrape). Playwright is a
    # backend library (not a GUI toolkit), driven headless as a subprocess, so it runs
    # identically on Windows/macOS/Linux/CI and keeps the stockroom.api import gate green.
    # Chromium is provisioned by `playwright install chromium` (bundled into the exe in S7).
    # Playwright drives BOTH the Chromium BrowserFetcher and Camoufox; camoufox constrains
    # it to <1.61, and the async API we use is stable across 1.60/1.61.
    "playwright>=1.55,<1.61",
    "pypdf>=4.0",
    # Altium's native documentation pipeline emits PDF. PDFium rasterizes those
    # exact native pages into safe, browser-neutral PNG review artifacts so the
    # Projects reviewer has the same visual workflow as KiCad's SVG exporter.
    "pypdfium2>=4.30",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    # The 3D model preview (M6d): trimesh reads the part's STEP/WRL model and exports
    # a web-ready GLB for the three.js viewer; cascadio is trimesh's STEP loader
    # (OpenCASCADE). Optional at runtime (an absent stack surfaces as an honest 502,
    # never a crash), but declared so the shipped app renders 3D out of the box.
    "trimesh>=4.0",
    "cascadio>=0.0.14",
    # The WebView2 host window (stockroom.host). Windows-scoped: pywebview is only
    # imported on the Windows host path, so a Linux dev/CI env never pulls its GUI
    # backends, while `uv sync --frozen` on the owner's Windows box provisions it so
    # the launcher's windowed entry can actually open a window (not ModuleNotFoundError).
    "pywebview>=5 ; sys_platform == 'win32'",
    "selectolax>=0.4.11",
    # The maximum-stealth render tier (stockroom.scrape.fetch.camoufox_browser): a Firefox
    # fork with genuine fingerprints that defeats Akamai AND DataDome (Mouser) where patched
    # Chromium is hard-blocked. Its browser build is provisioned by `camoufox fetch`.
    "camoufox[geoip]>=0.5.4",
    # The Altium DbLib data source (stockroom.altium.datasource): openpyxl writes the
    # MPN-keyed .xlsx an Altium .DbLib reads through the ACE engine. Pure-Python, no engine
    # at emit time; the .xlsx is a derived, gitignored artifact regenerated from the records.
    "openpyxl>=3.1",
    # Read Altium .SchLib/.PcbLib/.IntLib (OLE2/CFB) entry names + extract .IntLib embedded
    # sources (stockroom.altium.oleread / .extract). olefile is BSD, read-only, pure-Python;
    # combined with zlib it replicates KiCad's DecodeIntLibStream. We never write Altium binary.
    "olefile>=0.47",
    "cloakbrowser==0.5.2",
    "tuf==7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
    "ty>=0.0.63",
    # The backend suite is ~2700 tests dominated by git subprocess I/O, so it ran 8-9 minutes
    # serially and that cost was paid on every single slice. xdist spreads it across cores.
    # Adopted only after proving the parallel run reports the SAME pass count as the serial one,
    # because a faster suite that quietly loses tests is worse than a slow one.
    "pytest-xdist>=3.6",
    # scripts/pixelprobe.py reads what a screenshot ACTUALLY contains. The standing rule is to
    # critique a shot by measuring it, never by eye, and every visual slice was hand-rolling the
    # same throwaway Pillow snippet to do it.
    "pillow>=10.0",
    # Wired into scripts/gates.sh 2026-07-26. It was configured in this file and enforced by
    # NOTHING, run ad hoc at best, and the first repo-wide run found 48 issues including a
    # duplicate dict key in the LCSC field map and two computed-then-dropped variables, one of
    # which sat under a comment claiming a cross-sheet uniqueness nothing tested. A linter nobody
    # runs is decoration.
    "ruff>=0.6",
    # scripts/windrive.py talks to the REAL WebView2 target over CDP. The client is imported
    # lazily so its absence used to reduce every native-window check to "probe disabled" while
    # leaving the browser-substitute screenshots green.
    "websocket-client>=1.8",
    "pyinstaller>=6.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app/backend/stockroom"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["app/backend", "."]
testpaths = ["tests/backend"]
addopts = "-m 'not live_enrich'"
markers = [
    "requires_kicad_cli: test needs the kicad-cli binary; skipped when absent",
    "live_enrich: hits the real network; deselected by default, opt-in only",
    "windows_only: needs a real Windows machine (WebView2, KiCad config surgery); skipped elsewhere",
    "requires_browser: test launches a real headless Chromium; skipped when Playwright/Chromium cannot launch",
    "global_windows_mutex: test owns the one current-user Windows coordinator mutex and must run outside the parallel backend pool",
    "performance_budget: wall-clock acceptance budget that must run without competing backend workers",
    "serial_only: test owns process-global or shared filesystem state and must not run beside xdist workers",
]

[tool.ruff]
# Tuned to the existing style so the formatter does not churn untouched code. Runs on the files
# you touch via pre-commit; a repo-wide format is a separate deliberate task.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Lenient on purpose: real issues (pyflakes) + import order, not style nits. Line length is left
# to the formatter, and a couple of pragmatic ignores keep it out of the way.
select = ["F", "I"]
ignore = ["F401"]   # an unused import is often a deliberate re-export; ruff-format keeps it tidy

[tool.ruff.lint.isort]
# `stockroom` lives under app/backend, not at the repo root, so ruff cannot infer that it is OURS
# and was sorting it into the THIRD-PARTY block. Every existing test in this repo puts a blank line
# between `import pytest` and the `from stockroom...` imports, so without this declaration `ruff
# --fix` silently reformats each file it touches AWAY from the repo's own convention, and the
# reformat looks like a real finding. Declaring it is the fix; reformatting 200 files is not.
known-first-party = ["stockroom"]
