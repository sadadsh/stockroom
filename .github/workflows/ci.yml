name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    # A hard cap so a hung test (a browser launch that blocks on a headless Windows runner, a git
    # op waiting on a credential prompt) fails the job in minutes instead of running for hours.
    timeout-minutes: 30
    env:
      # Git must never block waiting for interactive credentials in CI (on Windows the credential
      # manager can hang a push/pull); fail fast instead so a bad remote surfaces as an error.
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: "never"
      # This is set before pytest collection. The suite's autouse fixture applies
      # the same isolation after collection begins, but a pair of STM corpus
      # modules resolve their optional source while being imported. CI must
      # never touch a platform credential manager, and Linux has none.
      STOCKROOM_CREDENTIALS_BACKEND: "memory"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install Pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Sync
        run: uv sync --frozen
      - name: Type check backend
        # Stockroom is a Windows desktop product; check the complete backend on
        # its declared runtime platform, including pywebview and Win32 APIs.
        run: uv run ty check app/backend/stockroom --python-platform win32
      - name: Run Native Window Host Suite
        shell: pwsh
        run: |
          $project = "tests/native/Stockroom.WindowHost.Tests/Stockroom.WindowHost.Tests.csproj"
          dotnet restore $project --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $project --configuration Release --no-restore --nologo
      - name: Run backend suite - parallel safe
        run: >-
          uv run pytest tests/backend -q -p no:randomly
          -m "not live_enrich and not global_windows_mutex and not performance_budget"
          --dist loadgroup -n 4
      - name: Run backend suite - serialized Windows and budgets
        run: >-
          uv run pytest tests/backend -q -p no:randomly
          -m "not live_enrich and (global_windows_mutex or performance_budget)"
          -n 0
