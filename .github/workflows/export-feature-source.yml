name: Export feature source

on:
  push:
    branches:
      - feat/component-dossier-overhaul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: component-dossier-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
