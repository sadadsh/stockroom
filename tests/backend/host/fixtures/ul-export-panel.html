Ultra Librarian's REAL export panel, captured 2026-07-27 from app.ultralibrarian.com for
TPD6E05U06RVZR (a part in the owner's library), signed in, via scripts/vendorprobe.py.

It exists so the guided-capture driver is tested against the vendor's ACTUAL markup instead
of against selectors we guessed. Before this, drivers.py carried first-guess selectors
(`[data-ecad='KiCad']`, `button.download`) that match NOTHING on this page, and the tests
asserted only that those guesses appeared in the generated string - which they always did.

Captured verbatim except the __RequestVerificationToken value, scrubbed (per-session CSRF).
No account details appear in it; it was scanned for e-mail addresses and bearer tokens.
-->
